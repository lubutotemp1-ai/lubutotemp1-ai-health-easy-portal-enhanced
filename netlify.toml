[build]
  base = "frontend"
  publish = "build"
  command = "npm run build"
  environment = {}

# Redirect all /api/* requests to the serverless function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/server/:splat"
  status = 200

# Configure Netlify Functions
[functions]
  directory = "backend/netlify/functions"
  node_bundler = "esbuild"
  # MongoDB (mongoose) is included in esbuild bundling
  # No external modules needed

# Cache headers - don't cache API responses
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
